services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: xtyl-api
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      API_PORT: 3000
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      FAL_KEY: ${FAL_KEY:-}
      AGNO_API_URL: ${AGNO_API_URL:-http://agno:7777}
      AGNO_SHARED_SECRET: ${AGNO_SHARED_SECRET:-local-agno-secret}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: xtyl-api-worker
    command: ['bun', '--bun', 'apps/api/dist/worker.js']
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      FAL_KEY: ${FAL_KEY:-}
      AGNO_API_URL: ${AGNO_API_URL:-http://agno:7777}
      AGNO_SHARED_SECRET: ${AGNO_SHARED_SECRET:-local-agno-secret}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped

  agno:
    build:
      context: .
      dockerfile: apps/agno/Dockerfile
    container_name: xtyl-agno
    ports:
      - '7777:7777'
    env_file:
      - .env
    environment:
      AGNO_SHARED_SECRET: ${AGNO_SHARED_SECRET:-local-agno-secret}
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:7777/health']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: xtyl-frontend
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api}
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: xtyl-admin
    ports:
      - '8081:80'
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: xtyl-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  redis-data:
