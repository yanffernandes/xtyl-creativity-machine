services:
  redis:
    image: redis:7-alpine
    container_name: xtyl-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  agno:
    build:
      context: .
      dockerfile: apps/agno/Dockerfile
    container_name: xtyl-agno
    ports:
      - '7777:7777'
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
