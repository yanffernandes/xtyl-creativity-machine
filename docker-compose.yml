# =============================================================================
# XTYL Creativity Machine - Production Docker Compose
# =============================================================================
# For deployment on Easypanel with external services:
# - Database: Supabase PostgreSQL
# - Storage: Cloudflare R2
# - Auth: Supabase Auth
# =============================================================================

services:
  # Backend: FastAPI Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    # Feature 025: Use expose instead of ports to limit external access
    # Access via nginx/reverse proxy in production
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ENVIRONMENT: production

      # Supabase Database
      DATABASE_URL: ${DATABASE_URL}

      # Supabase Auth
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}

      # Feature 025: Redis with password authentication
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0

      # Feature 025: Celery with password authentication
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/1

      # Cloudflare R2 Storage
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}

      # Email (Brevo)
      BREVO_API_KEY: ${BREVO_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@example.com}
      FROM_NAME: ${FROM_NAME:-XTYL}

      # Frontend URL
      FRONTEND_URL: ${FRONTEND_URL}

      # AI APIs
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # CORS Configuration
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

      # Supabase Admin (for password reset and user creation)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # Application URLs
      APP_URL: ${APP_URL:-https://xtyl.app}
      APP_TITLE: ${APP_TITLE:-XTYL Creativity Machine}
    networks:
      - xtyl-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Frontend: Next.js Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    restart: always
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      HOSTNAME: "0.0.0.0"
    networks:
      - xtyl-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Cache & Queue: Redis
  # Feature 025: Redis with password authentication
  redis:
    image: redis:7-alpine
    restart: always
    # Feature 025: Require password for Redis connections
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_in_production}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_in_production}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - xtyl-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # Celery Worker: Async task execution
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    # Using concurrency=2 to reduce CPU usage (was 4)
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Python Path
      PYTHONPATH: /app

      # Supabase Database
      DATABASE_URL: ${DATABASE_URL}

      # Feature 025: Redis with password authentication
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0

      # Feature 025: Celery with password authentication
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/1

      # Cloudflare R2 Storage
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}

      # AI APIs
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    networks:
      - xtyl-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  xtyl-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
