services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: xtyl-api
    restart: always
    expose:
      - '3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 3000
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      FAL_KEY: ${FAL_KEY:-}
      AGNO_API_URL: ${AGNO_API_URL:-http://agno:7777}
      AGNO_SHARED_SECRET: ${AGNO_SHARED_SECRET:-local-agno-secret}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: xtyl-api-worker
    restart: always
    command: ['bun', '--bun', 'apps/api/dist/worker.js']
    env_file:
      - .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FAL_KEY: ${FAL_KEY:-}
      AGNO_API_URL: ${AGNO_API_URL:-http://agno:7777}
      AGNO_SHARED_SECRET: ${AGNO_SHARED_SECRET:-local-agno-secret}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: xtyl-frontend
    restart: always
    expose:
      - '80'
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      VITE_API_URL: ${VITE_API_URL:-/api}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: xtyl-admin
    restart: always
    expose:
      - '80'
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: xtyl-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_in_production}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-changeme_in_production}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
