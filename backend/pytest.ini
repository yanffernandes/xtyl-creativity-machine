[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*

# Async configuration
asyncio_mode = auto

# Output configuration
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Coverage configuration
# Run with: pytest --cov=. --cov-report=html --cov-report=term-missing --cov-fail-under=80

# Custom markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may use database)
    slow: Tests that take > 1 second
    asyncio: Async tests

# Logging
log_cli = true
log_cli_level = WARNING

# Timeout for individual tests (in seconds)
timeout = 30

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
