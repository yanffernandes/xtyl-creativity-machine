openapi: 3.0.3
info:
  title: Voice Input Transcription API
  description: Audio transcription endpoint for the AI assistant chat interface
  version: 1.0.0

servers:
  - url: /api/v1
    description: Backend API

paths:
  /chat/transcribe:
    post:
      summary: Transcribe audio to text
      description: |
        Accepts an audio file and returns transcribed text using OpenRouter's
        audio-capable models. Requires authentication.
      operationId: transcribeAudio
      tags:
        - chat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file (webm, mp3, wav, m4a, mp4, mpeg)
                language_hint:
                  type: string
                  description: ISO 639-1 language code hint (e.g., "pt", "en")
                  example: pt
            encoding:
              audio:
                contentType: audio/webm, audio/mp3, audio/wav, audio/m4a, audio/mp4, audio/mpeg
      responses:
        '200':
          description: Transcription successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
              example:
                text: "Olá, como posso ajudar você hoje?"
                duration_seconds: 3.2
                language: "pt"
                processing_time_ms: 1847
        '400':
          description: Invalid request (bad format, empty audio, duration exceeded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionError'
              examples:
                invalid_format:
                  value:
                    error: invalid_format
                    message: "Formato de áudio não suportado. Use WebM, MP3, WAV ou M4A."
                empty_audio:
                  value:
                    error: empty_audio
                    message: "Nenhum áudio detectado no arquivo."
                duration_exceeded:
                  value:
                    error: duration_exceeded
                    message: "Duração máxima excedida. Máximo: 5 minutos."
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionError'
              example:
                error: unauthorized
                message: "Autenticação necessária."
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionError'
              example:
                error: file_too_large
                message: "Arquivo de áudio muito grande. Máximo: 25MB."
        '500':
          description: Server error during transcription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionError'
              example:
                error: transcription_failed
                message: "Falha ao transcrever áudio. Tente novamente."
        '502':
          description: External service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionError'
              example:
                error: api_error
                message: "Serviço de transcrição indisponível."

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT authentication token

  schemas:
    TranscriptionResponse:
      type: object
      required:
        - text
        - duration_seconds
        - language
        - processing_time_ms
      properties:
        text:
          type: string
          description: Transcribed text from the audio
          example: "Olá, como posso ajudar você hoje?"
        duration_seconds:
          type: number
          format: float
          description: Duration of the processed audio in seconds
          example: 3.2
        language:
          type: string
          description: Detected or specified language code (ISO 639-1)
          example: "pt"
        processing_time_ms:
          type: integer
          description: Server-side processing time in milliseconds
          example: 1847

    TranscriptionError:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error type identifier
          enum:
            - invalid_format
            - file_too_large
            - duration_exceeded
            - empty_audio
            - transcription_failed
            - api_error
            - unauthorized
          example: invalid_format
        message:
          type: string
          description: Human-readable error message in Portuguese
          example: "Formato de áudio não suportado."
        details:
          type: object
          description: Optional additional error details
          additionalProperties: true
