openapi: 3.0.3
info:
  title: Admin Panel API
  version: 1.0.0
  description: |
    Administrative endpoints for system configuration, user management,
    workspace management, and system monitoring.

    All endpoints require `super_admin` role.

servers:
  - url: http://localhost:8000
    description: Development server

security:
  - bearerAuth: []

tags:
  - name: admin-auth
    description: Admin authentication and verification
  - name: admin-models
    description: AI model configuration
  - name: admin-users
    description: User management
  - name: admin-workspaces
    description: Workspace management
  - name: admin-dashboard
    description: System metrics and dashboard
  - name: admin-settings
    description: System settings and configuration
  - name: admin-audit
    description: Audit log access

paths:
  # ========== AUTH ==========
  /admin/verify:
    get:
      tags: [admin-auth]
      summary: Verify admin access
      description: Check if current user has super_admin role
      operationId: verifyAdmin
      responses:
        '200':
          description: User is admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_admin: { type: boolean }
                  user_id: { type: string, format: uuid }
                  email: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  # ========== AI MODELS ==========
  /admin/models/config:
    get:
      tags: [admin-models]
      summary: Get AI model configuration
      operationId: getModelConfig
      responses:
        '200':
          description: Current model configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModelConfig'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags: [admin-models]
      summary: Update AI model configuration
      operationId: updateModelConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIModelConfigUpdate'
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIModelConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/models/available:
    get:
      tags: [admin-models]
      summary: List available models from OpenRouter
      operationId: listAvailableModels
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [text, image, embedding]
          description: Filter by model type
      responses:
        '200':
          description: Available models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableModel'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/models/validate:
    post:
      tags: [admin-models]
      summary: Validate a model ID
      operationId: validateModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model_id: { type: string }
              required: [model_id]
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  model_name: { type: string }
                  error: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'

  # ========== USERS ==========
  /admin/users:
    get:
      tags: [admin-users]
      summary: List all users
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, blocked]
          description: Filter by status
        - name: is_admin
          in: query
          schema:
            type: boolean
          description: Filter by admin status
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, email, last_active]
          description: Sort field
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{user_id}:
    get:
      tags: [admin-users]
      summary: Get user details
      operationId: getUserDetails
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User details with statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{user_id}/block:
    post:
      tags: [admin-users]
      summary: Block a user
      operationId: blockUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: User blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          description: Cannot block yourself
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{user_id}/unblock:
    post:
      tags: [admin-users]
      summary: Unblock a user
      operationId: unblockUser
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User unblocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{user_id}/promote:
    post:
      tags: [admin-users]
      summary: Promote user to super_admin
      operationId: promoteToAdmin
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User promoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/users/{user_id}/demote:
    post:
      tags: [admin-users]
      summary: Remove super_admin role
      operationId: demoteFromAdmin
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User demoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
        '400':
          description: Cannot demote yourself
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========== WORKSPACES ==========
  /admin/workspaces:
    get:
      tags: [admin-workspaces]
      summary: List all workspaces
      operationId: listWorkspaces
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SearchParam'
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [created_at, name, member_count]
      responses:
        '200':
          description: Paginated workspace list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/workspaces/{workspace_id}:
    get:
      tags: [admin-workspaces]
      summary: Get workspace details
      operationId: getWorkspaceDetails
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdParam'
      responses:
        '200':
          description: Workspace details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetails'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/workspaces/{workspace_id}/members/{user_id}:
    delete:
      tags: [admin-workspaces]
      summary: Remove member from workspace
      operationId: removeWorkspaceMember
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdParam'
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: Member removed
        '400':
          description: Cannot remove owner
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/workspaces/{workspace_id}/transfer:
    post:
      tags: [admin-workspaces]
      summary: Transfer workspace ownership
      operationId: transferWorkspaceOwnership
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_owner_id: { type: string, format: uuid }
              required: [new_owner_id]
      responses:
        '200':
          description: Ownership transferred
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetails'
        '400':
          description: New owner must be a member
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========== DASHBOARD ==========
  /admin/dashboard/metrics:
    get:
      tags: [admin-dashboard]
      summary: Get dashboard metrics
      operationId: getDashboardMetrics
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d, all]
            default: 30d
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/dashboard/alerts:
    get:
      tags: [admin-dashboard]
      summary: Get system alerts
      operationId: getSystemAlerts
      responses:
        '200':
          description: Active system alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemAlert'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/dashboard/usage:
    get:
      tags: [admin-dashboard]
      summary: Get AI usage statistics
      operationId: getUsageStats
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
        - name: group_by
          in: query
          schema:
            type: string
            enum: [day, model, user]
            default: day
      responses:
        '200':
          description: Usage statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageStats'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ========== SETTINGS ==========
  /admin/settings/limits:
    get:
      tags: [admin-settings]
      summary: Get global limits
      operationId: getGlobalLimits
      responses:
        '200':
          description: Global limits configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalLimits'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags: [admin-settings]
      summary: Update global limits
      operationId: updateGlobalLimits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalLimitsUpdate'
      responses:
        '200':
          description: Limits updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalLimits'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/settings/features:
    get:
      tags: [admin-settings]
      summary: Get feature flags
      operationId: getFeatureFlags
      responses:
        '200':
          description: Feature flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlags'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags: [admin-settings]
      summary: Update feature flags
      operationId: updateFeatureFlags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureFlagsUpdate'
      responses:
        '200':
          description: Feature flags updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlags'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/settings/api-keys:
    get:
      tags: [admin-settings]
      summary: Get API key status (masked)
      operationId: getApiKeyStatus
      responses:
        '200':
          description: API key status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyStatus'
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags: [admin-settings]
      summary: Update API keys
      operationId: updateApiKeys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyUpdate'
      responses:
        '200':
          description: API keys updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ========== AUDIT LOG ==========
  /admin/audit:
    get:
      tags: [admin-audit]
      summary: Get audit log
      operationId: getAuditLog
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - name: action
          in: query
          schema:
            type: string
          description: Filter by action type
        - name: admin_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by admin
        - name: entity_type
          in: query
          schema:
            type: string
          description: Filter by entity type
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Paginated audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    SearchParam:
      name: search
      in: query
      schema:
        type: string
      description: Search query

    UserIdParam:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    WorkspaceIdParam:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: Admin access required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        detail: { type: string }

    # ===== AI Models =====
    AIModelConfig:
      type: object
      properties:
        defaults:
          type: object
          properties:
            chat: { type: string }
            embedding: { type: string }
            vision: { type: string }
            document_analysis: { type: string }
            image_generation: { type: string }
            image_naming: { type: string }
        fallbacks:
          type: object
          properties:
            chat: { type: string }
            embedding: { type: string }
            vision: { type: string }
            document_analysis: { type: string }
            image_generation: { type: string }
            image_naming: { type: string }
        visible_in_selector:
          type: array
          items: { type: string }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string, format: uuid }

    AIModelConfigUpdate:
      type: object
      properties:
        defaults:
          type: object
          additionalProperties: { type: string }
        fallbacks:
          type: object
          additionalProperties: { type: string }
        visible_in_selector:
          type: array
          items: { type: string }

    AvailableModel:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        provider: { type: string }
        type: { type: string, enum: [text, image, embedding] }
        context_length: { type: integer }
        pricing:
          type: object
          properties:
            prompt: { type: number }
            completion: { type: number }

    # ===== Users =====
    UserListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string }
        is_super_admin: { type: boolean }
        is_blocked: { type: boolean }
        created_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time }
        workspace_count: { type: integer }

    UserListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserListItem'
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    UserDetails:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string }
        is_super_admin: { type: boolean }
        is_blocked: { type: boolean }
        blocked_at: { type: string, format: date-time }
        blocked_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        last_active_at: { type: string, format: date-time }
        workspaces:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              role: { type: string }
        stats:
          type: object
          properties:
            total_conversations: { type: integer }
            total_documents: { type: integer }
            total_tokens_used: { type: integer }
            tokens_this_month: { type: integer }

    # ===== Workspaces =====
    WorkspaceListItem:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        owner_id: { type: string, format: uuid }
        owner_email: { type: string }
        member_count: { type: integer }
        project_count: { type: integer }
        created_at: { type: string, format: date-time }

    WorkspaceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceListItem'
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    WorkspaceDetails:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        owner:
          type: object
          properties:
            id: { type: string, format: uuid }
            email: { type: string }
            full_name: { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string, format: uuid }
              email: { type: string }
              full_name: { type: string }
              role: { type: string }
              joined_at: { type: string, format: date-time }
        projects:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              document_count: { type: integer }
        stats:
          type: object
          properties:
            total_documents: { type: integer }
            total_conversations: { type: integer }
            total_tokens_used: { type: integer }

    # ===== Dashboard =====
    DashboardMetrics:
      type: object
      properties:
        users:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer }
            new_this_period: { type: integer }
            blocked: { type: integer }
        workspaces:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer }
            avg_members: { type: number }
        ai_usage:
          type: object
          properties:
            total_tokens: { type: integer }
            api_calls: { type: integer }
            error_rate: { type: number }
        period: { type: string }

    SystemAlert:
      type: object
      properties:
        id: { type: string }
        severity: { type: string, enum: [info, warning, error, critical] }
        title: { type: string }
        message: { type: string }
        created_at: { type: string, format: date-time }

    UsageStats:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              model: { type: string }
              user_id: { type: string }
              tokens: { type: integer }
              api_calls: { type: integer }
        period: { type: string }
        group_by: { type: string }

    # ===== Settings =====
    GlobalLimits:
      type: object
      properties:
        max_tokens_per_user_month: { type: integer }
        max_workspaces_per_user: { type: integer }
        max_documents_per_project: { type: integer }
        max_image_size_mb: { type: integer }
        max_concurrent_workflows: { type: integer }
        updated_at: { type: string, format: date-time }

    GlobalLimitsUpdate:
      type: object
      properties:
        max_tokens_per_user_month: { type: integer, minimum: 0 }
        max_workspaces_per_user: { type: integer, minimum: 1 }
        max_documents_per_project: { type: integer, minimum: 1 }
        max_image_size_mb: { type: integer, minimum: 1 }
        max_concurrent_workflows: { type: integer, minimum: 1 }

    FeatureFlags:
      type: object
      properties:
        enable_image_generation: { type: boolean }
        enable_workflows: { type: boolean }
        enable_rag: { type: boolean }
        enable_vision: { type: boolean }
        maintenance_mode: { type: boolean }
        updated_at: { type: string, format: date-time }

    FeatureFlagsUpdate:
      type: object
      additionalProperties: { type: boolean }

    ApiKeyStatus:
      type: object
      properties:
        openrouter:
          type: object
          properties:
            configured: { type: boolean }
            masked_key: { type: string }
            updated_at: { type: string, format: date-time }

    ApiKeyUpdate:
      type: object
      properties:
        openrouter_key: { type: string }

    # ===== Audit =====
    AuditLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        admin_id: { type: string, format: uuid }
        admin_email: { type: string }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        old_value: { type: object }
        new_value: { type: object }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }

    AuditLogResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
