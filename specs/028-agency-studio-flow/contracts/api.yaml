openapi: 3.0.3
info:
  title: Agency Studio Flow API
  description: API contracts for Feature 028 - Agency-Scale Studio Flow + Brush Selection
  version: 1.0.0

paths:
  # ============================================================================
  # COPY LIBRARY
  # ============================================================================
  /workspaces/{workspace_id}/copies:
    get:
      summary: List copy library items
      tags: [Copy Library]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          schema:
            type: string
          description: Search in title and content
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
          description: Filter by tags
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of copy library items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyLibraryList'

    post:
      summary: Create copy library item
      tags: [Copy Library]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyLibraryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyLibraryItem'

  /workspaces/{workspace_id}/copies/{copy_id}:
    get:
      summary: Get copy library item
      tags: [Copy Library]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: copy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Copy library item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyLibraryItem'

    put:
      summary: Update copy library item
      tags: [Copy Library]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: copy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyLibraryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyLibraryItem'

    delete:
      summary: Delete copy library item
      tags: [Copy Library]
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: copy_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  # ============================================================================
  # CAMPAIGNS
  # ============================================================================
  /projects/{project_id}/campaigns:
    get:
      summary: List campaign packages
      tags: [Campaigns]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: channel
          in: query
          schema:
            type: string
          description: Filter by channel
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignList'

    post:
      summary: Create campaign package
      tags: [Campaigns]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'

  /projects/{project_id}/campaigns/{campaign_id}:
    get:
      summary: Get campaign package
      tags: [Campaigns]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Campaign package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'

    put:
      summary: Update campaign package
      tags: [Campaigns]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'

    delete:
      summary: Delete campaign package
      tags: [Campaigns]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  # ============================================================================
  # IMAGE GENERATION (Extended)
  # ============================================================================
  /image-generation/generate-batch:
    post:
      summary: Generate image batch with visual context
      description: Extended to support reference assets, brand context, and campaign association
      tags: [Image Generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageBatchRequestExtended'
      responses:
        '200':
          description: Batch started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageBatchResponse'

  /image-generation/refine-with-mask:
    post:
      summary: Refine image with mask (inpainting)
      tags: [Image Generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefineWithMaskRequest'
      responses:
        '200':
          description: Refinement started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefineWithMaskResponse'

  # ============================================================================
  # DOCUMENT VERSIONS
  # ============================================================================
  /documents/{document_id}/versions:
    get:
      summary: Get document version history
      tags: [Document Versions]
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionHistoryResponse'

  /documents/{document_id}/versions/{version}/restore:
    post:
      summary: Restore document to specific version
      tags: [Document Versions]
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Document restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'

components:
  schemas:
    # Copy Library
    CopyLibraryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CopyLibraryCreate:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          minLength: 1
          maxLength: 10000
        tags:
          type: array
          items:
            type: string
          maxItems: 20

    CopyLibraryUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          minLength: 1
          maxLength: 10000
        tags:
          type: array
          items:
            type: string
          maxItems: 20

    CopyLibraryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CopyLibraryItem'
        total:
          type: integer

    # Campaigns
    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        channel:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CampaignCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        channel:
          type: string
          maxLength: 100
        metadata:
          type: object

    CampaignUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        channel:
          type: string
          maxLength: 100
        metadata:
          type: object

    CampaignList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        total:
          type: integer

    # Image Generation Extended
    ImageBatchRequestExtended:
      type: object
      required: [prompt, project_id]
      properties:
        prompt:
          type: string
          minLength: 1
        project_id:
          type: string
          format: uuid
        count:
          type: integer
          minimum: 1
          maximum: 8
          default: 4
        model:
          type: string
        visual_style:
          type: string
        layout:
          type: string
        aspect_ratio:
          type: string
        # NEW fields for 028
        reference_assets:
          type: array
          items:
            type: string
            format: uuid
          description: Visual asset UUIDs to use as reference
        asset_mode:
          type: string
          enum: [style, compose, base]
          default: style
        apply_brand_context:
          type: boolean
          default: true
        campaign_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
        channel:
          type: string

    ImageBatchResponse:
      type: object
      properties:
        batch_id:
          type: string
        status:
          type: string
        message:
          type: string

    # Mask Refinement
    RefineWithMaskRequest:
      type: object
      required: [document_id, mask_base64, prompt]
      properties:
        document_id:
          type: string
          format: uuid
          description: Source image document
        mask_base64:
          type: string
          description: PNG mask as base64 (white=edit, black=preserve)
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          description: What to generate in the masked region
        model:
          type: string
          description: Override default model

    RefineWithMaskResponse:
      type: object
      properties:
        mask_id:
          type: string
          format: uuid
        status:
          type: string
        result_document_id:
          type: string
          format: uuid
          description: New document with refined image

    # Document Versions
    VersionEntry:
      type: object
      properties:
        version:
          type: integer
        title:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid

    VersionHistoryResponse:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        current_version:
          type: integer
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionEntry'
          maxItems: 10

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        current_version:
          type: integer
        campaign_id:
          type: string
          format: uuid
        tags:
          type: array
          items:
            type: string
        channel:
          type: string
