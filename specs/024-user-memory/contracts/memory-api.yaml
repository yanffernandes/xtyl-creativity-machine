openapi: 3.1.0
info:
  title: User Memory API
  version: 1.0.0
  description: API for managing user memories extracted from chat conversations

servers:
  - url: /api/v1
    description: API v1

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    MemoryCategory:
      type: string
      enum:
        - personal
        - professional
        - preference
        - plan
        - health
        - other

    Memory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        project_id:
          type: string
        content:
          type: string
          maxLength: 2000
        category:
          $ref: '#/components/schemas/MemoryCategory'
        source_conversation_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - project_id
        - content
        - category
        - created_at
        - updated_at

    MemoryCreate:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        category:
          $ref: '#/components/schemas/MemoryCategory'
          default: other
      required:
        - content

    MemoryUpdate:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        category:
          $ref: '#/components/schemas/MemoryCategory'

    MemoryListResponse:
      type: object
      properties:
        memories:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer

    MemorySearchRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        category:
          $ref: '#/components/schemas/MemoryCategory'
      required:
        - query

    MemorySearchResponse:
      type: object
      properties:
        memories:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        query:
          type: string

    Error:
      type: object
      properties:
        detail:
          type: string

paths:
  /projects/{project_id}/memories:
    get:
      summary: List user memories for a project
      operationId: listMemories
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/MemoryCategory'
      responses:
        '200':
          description: List of memories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied to project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a memory manually
      operationId: createMemory
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreate'
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied to project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete all memories for a project
      operationId: deleteAllMemories
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: All memories deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied to project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project_id}/memories/{memory_id}:
    get:
      summary: Get a specific memory
      operationId: getMemory
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memory details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update a memory
      operationId: updateMemory
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryUpdate'
      responses:
        '200':
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a memory
      operationId: deleteMemory
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Memory deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /projects/{project_id}/memories/search:
    post:
      summary: Search memories by semantic similarity
      operationId: searchMemories
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySearchResponse'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Access denied to project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /admin/config/memory:
    get:
      summary: Get memory system configuration
      operationId: getMemoryConfig
      tags:
        - Admin
      responses:
        '200':
          description: Memory configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  memory_extraction_model:
                    type: string
                  memory_system_enabled:
                    type: boolean
                  memory_max_per_user_project:
                    type: integer
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update memory system configuration
      operationId: updateMemoryConfig
      tags:
        - Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                memory_extraction_model:
                  type: string
                memory_system_enabled:
                  type: boolean
                memory_max_per_user_project:
                  type: integer
                  minimum: 10
                  maximum: 500
      responses:
        '200':
          description: Configuration updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Invalid configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
