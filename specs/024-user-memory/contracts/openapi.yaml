openapi: 3.1.0
info:
  title: User Memory System API
  description: API for managing user memories extracted from chat conversations
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

components:
  schemas:
    MemoryCategory:
      type: string
      enum: [personal, professional, preference, plan, health, other]
      description: Category of the memory

    UserMemory:
      type: object
      required:
        - id
        - user_id
        - project_id
        - content
        - category
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique memory identifier
        user_id:
          type: string
          format: uuid
          description: User who owns this memory
        project_id:
          type: string
          description: Project scope for this memory
        content:
          type: string
          description: Memory content/fact
          maxLength: 2000
        category:
          $ref: '#/components/schemas/MemoryCategory'
        source_conversation_id:
          type: string
          nullable: true
          description: Conversation from which memory was extracted
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MemoryCreate:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        category:
          $ref: '#/components/schemas/MemoryCategory'
          default: other

    MemoryUpdate:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        category:
          $ref: '#/components/schemas/MemoryCategory'

    MemoryListResponse:
      type: object
      required:
        - memories
        - total
        - page
        - per_page
      properties:
        memories:
          type: array
          items:
            $ref: '#/components/schemas/UserMemory'
        total:
          type: integer
          description: Total number of memories
        page:
          type: integer
          description: Current page number
        per_page:
          type: integer
          description: Items per page

    MemorySearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          description: Search query for semantic search
        limit:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
        category:
          $ref: '#/components/schemas/MemoryCategory'

    MemorySearchResponse:
      type: object
      required:
        - memories
        - query
      properties:
        memories:
          type: array
          items:
            $ref: '#/components/schemas/UserMemory'
        query:
          type: string

    DeleteAllResponse:
      type: object
      required:
        - deleted_count
      properties:
        deleted_count:
          type: integer
          description: Number of memories deleted

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

paths:
  /projects/{project_id}/memories:
    get:
      summary: List user memories
      description: Get all memories for the authenticated user in a project
      operationId: listMemories
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/MemoryCategory'
      responses:
        '200':
          description: List of memories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a memory manually
      description: Add a new memory for the authenticated user
      operationId: createMemory
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryCreate'
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMemory'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Memory already exists (duplicate content)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete all memories
      description: Remove all memories for the authenticated user in a project
      operationId: deleteAllMemories
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Memories deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAllResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{project_id}/memories/{memory_id}:
    get:
      summary: Get a specific memory
      description: Retrieve a single memory by ID
      operationId: getMemory
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memory details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMemory'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update a memory
      description: Modify an existing memory
      operationId: updateMemory
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryUpdate'
      responses:
        '200':
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMemory'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a memory
      description: Remove a specific memory
      operationId: deleteMemory
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Memory deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{project_id}/memories/search:
    post:
      summary: Search memories
      description: Semantic search through user memories
      operationId: searchMemories
      tags:
        - Memories
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemorySearchResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Memories
    description: User memory management endpoints
