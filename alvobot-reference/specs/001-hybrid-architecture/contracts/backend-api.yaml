openapi: 3.0.3
info:
  title: AlvoBot Backend API
  description: |
    Backend API for AlvoBot hybrid architecture. This API provides health checks,
    authentication validation, and foundation for future complex integrations.

    **Note**: Most CRUD operations remain frontend → Supabase direct. This backend
    handles only complex features requiring server-side processing.
  version: 1.0.0
  contact:
    name: AlvoBot Team
    url: https://alvobot.ai

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://api.alvobot.ai
    description: Production

tags:
  - name: Health
    description: Service health and monitoring endpoints
  - name: Auth
    description: Authentication and authorization

paths:
  /health:
    get:
      tags:
        - Health
      summary: Comprehensive health check
      description: |
        Returns detailed health status including all service dependencies.
        Used by monitoring systems and load balancers.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  value:
                    status: 'healthy'
                    timestamp: '2025-12-04T10:00:00Z'
                    uptime: 3600
                    version: '1.0.0'
                    dependencies:
                      redis:
                        status: 'healthy'
                        responseTime: 2
                      supabase:
                        status: 'healthy'
                        responseTime: 45
        '503':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                unhealthy:
                  value:
                    status: 'unhealthy'
                    timestamp: '2025-12-04T10:00:00Z'
                    uptime: 120
                    version: '1.0.0'
                    dependencies:
                      redis:
                        status: 'unhealthy'
                        error: 'Connection refused'

  /health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: |
        Simple liveness check for Kubernetes/Docker health checks.
        Returns 200 if the application process is running.
      operationId: getLiveness
      responses:
        '200':
          description: Application is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'alive'

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: |
        Readiness check for load balancers. Returns 200 only when all
        dependencies are ready to accept traffic.
      operationId: getReadiness
      responses:
        '200':
          description: Service ready to accept traffic
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'ready'
        '503':
          description: Service not ready (dependencies unavailable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: 'not_ready'
                  reason:
                    type: string
                    example: 'Redis connection not established'

  /auth/validate:
    post:
      tags:
        - Auth
      summary: Validate Supabase JWT token
      description: |
        Validates a Supabase authentication token and returns user information.
        Used by frontend to verify token validity without calling Supabase.
      operationId: validateToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenValidationResponse'
              examples:
                valid:
                  value:
                    valid: true
                    user:
                      id: '123e4567-e89b-12d3-a456-426614174000'
                      email: 'user@example.com'
                      role: 'authenticated'
                    expiresAt: '2025-12-05T10:00:00Z'
        '401':
          description: Token is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                expired:
                  value:
                    error: 'Unauthorized'
                    message: 'Token has expired'
                    statusCode: 401
        '422':
          description: Token format is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/user:
    get:
      tags:
        - Auth
      summary: Get current user
      description: |
        Returns information about the currently authenticated user based on JWT token.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                user:
                  value:
                    id: '123e4567-e89b-12d3-a456-426614174000'
                    email: 'user@example.com'
                    emailConfirmed: true
                    role: 'authenticated'
                    lastSignInAt: '2025-12-04T09:00:00Z'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase JWT token obtained from authentication.
        Include in Authorization header as: `Bearer <token>`

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - uptime
        - version
      properties:
        status:
          type: string
          enum: [healthy, unhealthy, starting]
          description: Overall service health status
          example: 'healthy'
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of health check
          example: '2025-12-04T10:00:00Z'
        uptime:
          type: integer
          description: Service uptime in seconds
          example: 3600
        version:
          type: string
          description: Application version
          example: '1.0.0'
        dependencies:
          type: object
          description: Health status of service dependencies
          properties:
            redis:
              $ref: '#/components/schemas/DependencyHealth'
            supabase:
              $ref: '#/components/schemas/DependencyHealth'

    DependencyHealth:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          example: 'healthy'
        responseTime:
          type: integer
          description: Response time in milliseconds
          example: 45
        error:
          type: string
          description: Error message if unhealthy
          example: 'Connection timeout'

    TokenValidationResponse:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
          description: Whether the token is valid
          example: true
        user:
          type: object
          description: User information from token
          properties:
            id:
              type: string
              format: uuid
              description: User ID from Supabase
              example: '123e4567-e89b-12d3-a456-426614174000'
            email:
              type: string
              format: email
              description: User email
              example: 'user@example.com'
            role:
              type: string
              description: User role
              example: 'authenticated'
        expiresAt:
          type: string
          format: date-time
          description: Token expiration timestamp
          example: '2025-12-05T10:00:00Z'

    UserResponse:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
          description: User unique identifier
          example: '123e4567-e89b-12d3-a456-426614174000'
        email:
          type: string
          format: email
          description: User email address
          example: 'user@example.com'
        emailConfirmed:
          type: boolean
          description: Whether email is verified
          example: true
        role:
          type: string
          description: User role in the system
          example: 'authenticated'
        lastSignInAt:
          type: string
          format: date-time
          description: Last sign-in timestamp
          example: '2025-12-04T09:00:00Z'

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - statusCode
      properties:
        error:
          type: string
          description: Error type
          example: 'Unauthorized'
        message:
          type: string
          description: Human-readable error message
          example: 'Token has expired'
        statusCode:
          type: integer
          description: HTTP status code
          example: 401
        details:
          type: array
          description: Additional error details (validation errors)
          items:
            type: object
            properties:
              field:
                type: string
                example: 'email'
              message:
                type: string
                example: 'must be a valid email'
