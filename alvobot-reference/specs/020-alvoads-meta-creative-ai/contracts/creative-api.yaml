openapi: 3.0.3
info:
  title: AlvoADS Meta Creative AI API
  description: API para geração automatizada de criativos (imagens + textos) por IA
  version: 1.0.0
servers:
  - url: /api/meta/creatives
    description: Creative endpoints

paths:
  /generate-images:
    post:
      summary: Gerar imagens por IA
      description: Gera uma ou mais imagens usando DALL-E ou Imagen baseado no contexto do artigo
      operationId: generateImages
      tags:
        - Image Generation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateImagesRequest'
      responses:
        '200':
          description: Imagens geradas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateImagesResponse'
        '400':
          description: Parâmetros inválidos ou créditos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
        '500':
          description: Erro na geração

  /regenerate-image:
    post:
      summary: Regenerar uma imagem específica
      description: Regenera uma imagem rejeitada usando o mesmo contexto
      operationId: regenerateImage
      tags:
        - Image Generation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateImageRequest'
      responses:
        '200':
          description: Imagem regenerada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedImage'
        '400':
          description: Parâmetros inválidos ou créditos insuficientes
        '401':
          description: Não autenticado

  /generate-ad-copy:
    post:
      summary: Gerar textos de anúncio
      description: Gera textos (primary_text, headline, description) para uma imagem aprovada
      operationId: generateAdCopy
      tags:
        - Text Generation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAdCopyRequest'
      responses:
        '200':
          description: Textos gerados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedAdCopy'
        '400':
          description: Parâmetros inválidos ou créditos insuficientes
        '401':
          description: Não autenticado

  /library:
    get:
      summary: Listar criativos da biblioteca
      description: Retorna todos os criativos aprovados do usuário
      operationId: listLibraryCreatives
      tags:
        - Creative Library
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: article_id
          in: query
          schema:
            type: integer
          description: Filtrar por artigo de origem
        - name: model
          in: query
          schema:
            type: string
            enum: [dall-e-3, imagen-3]
          description: Filtrar por modelo
        - name: style
          in: query
          schema:
            type: string
          description: Filtrar por estilo
        - name: format
          in: query
          schema:
            type: string
            enum: ['1:1', '9:16', '16:9']
          description: Filtrar por formato
      responses:
        '200':
          description: Lista de criativos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryResponse'
        '401':
          description: Não autenticado

  /library/{id}:
    delete:
      summary: Remover criativo da biblioteca
      description: Remove um criativo da biblioteca (soft delete)
      operationId: deleteLibraryCreative
      tags:
        - Creative Library
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Criativo removido com sucesso
        '401':
          description: Não autenticado
        '404':
          description: Criativo não encontrado

  /credits/preview:
    post:
      summary: Preview de custo de créditos
      description: Calcula o custo em créditos antes de gerar
      operationId: previewCredits
      tags:
        - Credits
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditsPreviewRequest'
      responses:
        '200':
          description: Preview de créditos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsPreviewResponse'
        '401':
          description: Não autenticado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    GenerateImagesRequest:
      type: object
      required:
        - articles
        - count
        - model
        - format
      properties:
        articles:
          type: array
          items:
            $ref: '#/components/schemas/ArticleContext'
          minItems: 1
          maxItems: 20
        count:
          type: integer
          description: Número de imagens a gerar (1 por AdSet)
          minimum: 1
          maximum: 20
        model:
          type: string
          enum: [dall-e-3, imagen-3]
          description: Modelo de IA para geração
        format:
          type: string
          enum: ['1:1', '9:16', '16:9']
          description: Aspect ratio da imagem
        userDirections:
          type: string
          maxLength: 500
          description: Direcionamentos opcionais do usuário

    ArticleContext:
      type: object
      required:
        - id
        - title
        - keyword
      properties:
        id:
          type: integer
        title:
          type: string
        keyword:
          type: string
        excerpt:
          type: string

    GenerateImagesResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/GeneratedImage'
        creditsConsumed:
          type: integer
        totalGenerated:
          type: integer
        totalFailed:
          type: integer

    GeneratedImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        articleId:
          type: integer
        imageUrl:
          type: string
          format: uri
        storagePath:
          type: string
        model:
          type: string
          enum: [dall-e-3, imagen-3]
        style:
          type: string
        promptUsed:
          type: string
        format:
          type: string
        status:
          type: string
          enum: [completed, failed]
        error:
          type: string
          description: Mensagem de erro se status=failed
        adsetIndex:
          type: integer

    RegenerateImageRequest:
      type: object
      required:
        - articleId
        - adsetIndex
        - model
        - format
      properties:
        articleId:
          type: integer
        adsetIndex:
          type: integer
        model:
          type: string
          enum: [dall-e-3, imagen-3]
        format:
          type: string
          enum: ['1:1', '9:16', '16:9']
        userDirections:
          type: string

    GenerateAdCopyRequest:
      type: object
      required:
        - libraryId
        - articleId
      properties:
        libraryId:
          type: string
          format: uuid
          description: ID do criativo na biblioteca
        articleId:
          type: integer
          description: ID do artigo para contexto

    GeneratedAdCopy:
      type: object
      properties:
        primaryText:
          type: string
          maxLength: 125
        headline:
          type: string
          maxLength: 27
        description:
          type: string
          maxLength: 27
        suggestedCta:
          type: string
          enum: [LEARN_MORE, SHOP_NOW, SIGN_UP, CONTACT_US, GET_OFFER, DOWNLOAD]
        creditsConsumed:
          type: integer

    LibraryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LibraryCreative'
        pagination:
          $ref: '#/components/schemas/Pagination'

    LibraryCreative:
      type: object
      properties:
        id:
          type: string
          format: uuid
        imageUrl:
          type: string
          format: uri
        articleId:
          type: integer
        articleTitle:
          type: string
        model:
          type: string
        style:
          type: string
        format:
          type: string
        createdAt:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    CreditsPreviewRequest:
      type: object
      required:
        - imageCount
      properties:
        imageCount:
          type: integer
          minimum: 1
        generateAdCopy:
          type: boolean
          default: true

    CreditsPreviewResponse:
      type: object
      properties:
        imageCredits:
          type: integer
        textCredits:
          type: integer
        totalCredits:
          type: integer
        userBalance:
          type: integer
        hasSufficientCredits:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string
