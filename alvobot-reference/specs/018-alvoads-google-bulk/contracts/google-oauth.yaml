openapi: 3.0.3
info:
  title: AlvoADS Google - OAuth API
  version: 1.0.0
  description: Endpoints para autenticação OAuth 2.0 com Google Ads

servers:
  - url: http://localhost:3001
    description: Development server

paths:
  /google/oauth/authorize:
    post:
      summary: Iniciar fluxo OAuth
      description: Gera URL de autorização para redirecionar usuário ao Google
      tags: [OAuth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - connection_name
              properties:
                connection_name:
                  type: string
                  description: Nome para identificar a conexão
                  example: "Minha Conta Google Ads"
                redirect_uri:
                  type: string
                  description: URI de callback (opcional, usa padrão se não fornecido)
      responses:
        '200':
          description: URL de autorização gerada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  authorization_url:
                    type: string
                    example: "https://accounts.google.com/o/oauth2/v2/auth?..."
                  state:
                    type: string
                    description: State token para validação no callback
        '401':
          $ref: '#/components/responses/Unauthorized'

  /google/oauth/callback:
    get:
      summary: Callback OAuth
      description: Recebe o código de autorização do Google e troca por tokens
      tags: [OAuth]
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Código de autorização do Google
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: State token para validação CSRF
        - name: error
          in: query
          schema:
            type: string
          description: Código de erro (se autorização negada)
      responses:
        '302':
          description: Redireciona para frontend com resultado
          headers:
            Location:
              schema:
                type: string
              description: URL do frontend com connection_id ou erro
        '400':
          description: Erro na autorização
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /google/connections:
    get:
      summary: Listar conexões do usuário
      tags: [Connections]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de conexões
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/GoogleConnection'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /google/connections/{id}:
    delete:
      summary: Remover conexão
      tags: [Connections]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Conexão removida
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /google/connections/{id}/refresh:
    post:
      summary: Atualizar token de acesso
      tags: [Connections]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Token atualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Falha ao atualizar token (reautenticação necessária)

  /google/connections/{id}/customers:
    get:
      summary: Listar contas Google Ads acessíveis
      description: Para contas MCC, retorna lista de sub-contas
      tags: [Connections]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de contas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  customers:
                    type: array
                    items:
                      type: object
                      properties:
                        customer_id:
                          type: string
                        name:
                          type: string
                        currency:
                          type: string
                        timezone:
                          type: string
                        is_manager:
                          type: boolean

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    GoogleConnection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer_id:
          type: string
          example: "1234567890"
        customer_name:
          type: string
          example: "Minha Empresa"
        account_type:
          type: string
          enum: [standard, manager]
        currency_code:
          type: string
          example: "BRL"
        is_active:
          type: boolean
        last_used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        message:
          type: string

  responses:
    Unauthorized:
      description: Token inválido ou expirado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
