openapi: 3.0.3
info:
  title: AlvoADS Google - Bulk Campaigns API
  version: 1.0.0
  description: Endpoints para criação de campanhas Google Ads em massa

servers:
  - url: http://localhost:3001
    description: Development server

paths:
  # ==================== BULK LOCATION ====================
  /google/campaigns/bulk/location:
    post:
      summary: Criar campanhas por localização
      description: Cria variações de uma campanha base para múltiplas localizações
      tags: [Bulk Location]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkLocationRequest'
      responses:
        '202':
          description: Job criado e em processamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobResponse'
        '400':
          description: Erro de validação
        '402':
          description: Créditos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientCreditsError'

  /google/campaigns/bulk/location/preview:
    post:
      summary: Preview de campanhas por localização
      description: Gera preview das campanhas sem criar (para revisão)
      tags: [Bulk Location]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkLocationRequest'
      responses:
        '200':
          description: Preview das campanhas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  preview:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignPreview'
                  estimated_credits:
                    type: integer

  # ==================== BULK PRODUCT ====================
  /google/campaigns/bulk/product:
    post:
      summary: Criar campanhas por produto
      description: Cria campanhas para múltiplos produtos com IA
      tags: [Bulk Product]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkProductRequest'
      responses:
        '202':
          description: Job criado e em processamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobResponse'
        '400':
          description: Erro de validação
        '402':
          description: Créditos insuficientes

  /google/campaigns/bulk/product/generate-content:
    post:
      summary: Gerar conteúdo com IA para produtos
      description: Gera keywords, headlines e descriptions para lista de produtos
      tags: [Bulk Product]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - products
                - ai_settings
              properties:
                products:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
                ai_settings:
                  $ref: '#/components/schemas/AISettings'
      responses:
        '200':
          description: Conteúdo gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  generated_content:
                    type: array
                    items:
                      $ref: '#/components/schemas/GeneratedProductContent'
                  credits_used:
                    type: integer

  # ==================== SPREADSHEET IMPORT ====================
  /google/campaigns/bulk/spreadsheet/upload:
    post:
      summary: Upload de planilha
      description: Faz upload e parse inicial de planilha CSV/Excel
      tags: [Spreadsheet Import]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo CSV ou Excel (.xlsx)
      responses:
        '200':
          description: Planilha processada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpreadsheetParseResult'
        '400':
          description: Arquivo inválido

  /google/campaigns/bulk/spreadsheet/import:
    post:
      summary: Importar campanhas de planilha
      description: Cria campanhas a partir de planilha processada
      tags: [Spreadsheet Import]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpreadsheetImportRequest'
      responses:
        '202':
          description: Job criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobResponse'
        '400':
          description: Erro de validação
        '402':
          description: Créditos insuficientes

  /google/campaigns/bulk/spreadsheet/template:
    get:
      summary: Download template de planilha
      description: Retorna template Excel para importação
      tags: [Spreadsheet Import]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Arquivo template
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  # ==================== DUPLICATE ====================
  /google/campaigns/bulk/duplicate:
    post:
      summary: Duplicar campanhas
      description: Cria cópias de um template existente
      tags: [Duplicate]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateRequest'
      responses:
        '202':
          description: Job criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobResponse'
        '400':
          description: Erro de validação
        '404':
          description: Template origem não encontrado

  # ==================== JOBS ====================
  /google/campaigns/bulk/jobs:
    get:
      summary: Listar jobs de operações em massa
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed, partial]
        - name: type
          in: query
          schema:
            type: string
            enum: [bulk_location, bulk_product, spreadsheet, duplicate]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/BulkJob'
                  total:
                    type: integer

  /google/campaigns/bulk/jobs/{id}:
    get:
      summary: Detalhes de um job
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes do job
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  job:
                    $ref: '#/components/schemas/BulkJobDetail'

    delete:
      summary: Cancelar job em andamento
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job cancelado
        '400':
          description: Job não pode ser cancelado (já completado)

  /google/campaigns/bulk/jobs/{id}/progress:
    get:
      summary: Progresso do job (SSE)
      description: Server-Sent Events para acompanhar progresso em tempo real
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stream de eventos
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  completed_items:
                    type: integer
                  failed_items:
                    type: integer
                  current_item:
                    type: string

  /google/campaigns/bulk/jobs/{id}/retry-failed:
    post:
      summary: Retentar itens com falha
      tags: [Jobs]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Retry iniciado
        '400':
          description: Nenhum item com falha para retentar

  # ==================== BATCH ACTIONS ====================
  /google/campaigns/bulk/publish:
    post:
      summary: Publicar campanhas em lote
      description: Publica múltiplas campanhas (templates) de uma vez
      tags: [Batch Actions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - template_ids
                - connection_id
              properties:
                template_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 50
                connection_id:
                  type: string
                  format: uuid
                dry_run:
                  type: boolean
                  default: false
      responses:
        '202':
          description: Publicação em lote iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobResponse'

  /google/campaigns/bulk/pause:
    post:
      summary: Pausar campanhas em lote
      tags: [Batch Actions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - template_ids
              properties:
                template_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Campanhas pausadas

  /google/campaigns/bulk/delete:
    post:
      summary: Excluir campanhas em lote
      tags: [Batch Actions]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - template_ids
              properties:
                template_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Campanhas excluídas

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ==================== BULK LOCATION ====================
    BulkLocationRequest:
      type: object
      required:
        - connection_id
        - base_template
        - locations
      properties:
        connection_id:
          type: string
          format: uuid
        base_template:
          $ref: '#/components/schemas/BaseTemplate'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationConfig'
          minItems: 1
          maxItems: 50
        variations:
          $ref: '#/components/schemas/LocationVariations'
        publish_immediately:
          type: boolean
          default: false

    BaseTemplate:
      type: object
      required:
        - campaign
        - ad_group
      properties:
        campaign:
          type: object
          required:
            - name
            - goal
            - budget
          properties:
            name:
              type: string
            goal:
              type: string
              enum: [SALES, LEADS, WEBSITE_TRAFFIC, BRAND_AWARENESS]
            budget:
              type: number
            budget_type:
              type: string
              enum: [daily, total]
            bidding_strategy:
              type: string
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
        ad_group:
          type: object
          properties:
            name:
              type: string
            keywords:
              type: array
              items:
                $ref: '#/components/schemas/Keyword'
            ads:
              type: array
              items:
                $ref: '#/components/schemas/SearchAd'
        extensions:
          $ref: '#/components/schemas/Extensions'

    LocationConfig:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          description: Google Geo Target Constant ID
        name:
          type: string
        custom_budget:
          type: number
        custom_keywords:
          type: array
          items:
            type: string

    LocationVariations:
      type: object
      properties:
        include_location_in_name:
          type: boolean
          default: true
        include_location_in_keywords:
          type: boolean
          default: true
        include_location_in_ads:
          type: boolean
          default: true
        name_template:
          type: string
          example: "{{campaign}} - {{cidade}}"
        keyword_template:
          type: string
          example: "{{keyword}} em {{cidade}}"
        headline_template:
          type: string
          example: "{{headline}} {{cidade}}"

    # ==================== BULK PRODUCT ====================
    BulkProductRequest:
      type: object
      required:
        - connection_id
        - products
        - campaign_defaults
      properties:
        connection_id:
          type: string
          format: uuid
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
          minItems: 1
          maxItems: 50
        ai_settings:
          $ref: '#/components/schemas/AISettings'
        campaign_defaults:
          $ref: '#/components/schemas/CampaignDefaults'
        publish_immediately:
          type: boolean
          default: false

    Product:
      type: object
      required:
        - name
        - url
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        price:
          type: number
        category:
          type: string
        image_url:
          type: string
          format: uri

    AISettings:
      type: object
      properties:
        generate_keywords:
          type: boolean
          default: true
        generate_headlines:
          type: boolean
          default: true
        generate_descriptions:
          type: boolean
          default: true
        keywords_per_product:
          type: integer
          minimum: 5
          maximum: 50
          default: 15
        headlines_per_product:
          type: integer
          minimum: 3
          maximum: 15
          default: 10
        descriptions_per_product:
          type: integer
          minimum: 2
          maximum: 4
          default: 4
        keyword_match_types:
          type: array
          items:
            type: string
            enum: [BROAD, PHRASE, EXACT]
          default: [BROAD, PHRASE]
        tone:
          type: string
          enum: [professional, casual, urgent, friendly]
          default: professional

    CampaignDefaults:
      type: object
      required:
        - goal
        - budget
        - locations
      properties:
        goal:
          type: string
        budget:
          type: number
        budget_type:
          type: string
          enum: [daily, total]
        bidding_strategy:
          type: string
        locations:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
          default: ["pt"]

    GeneratedProductContent:
      type: object
      properties:
        product_name:
          type: string
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/Keyword'
        headlines:
          type: array
          items:
            type: string
        descriptions:
          type: array
          items:
            type: string

    # ==================== SPREADSHEET ====================
    SpreadsheetParseResult:
      type: object
      properties:
        success:
          type: boolean
        file_name:
          type: string
        encoding:
          type: string
        headers:
          type: array
          items:
            type: string
        row_count:
          type: integer
        preview:
          type: array
          items:
            type: object
          maxItems: 5
        suggested_mapping:
          $ref: '#/components/schemas/ColumnMapping'
        validation_errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ColumnMapping:
      type: object
      properties:
        campaign_name:
          type: string
        budget:
          type: string
        keywords:
          type: string
        headlines:
          type: string
        descriptions:
          type: string
        final_url:
          type: string
        locations:
          type: string

    SpreadsheetImportRequest:
      type: object
      required:
        - connection_id
        - file_id
        - column_mapping
      properties:
        connection_id:
          type: string
          format: uuid
        file_id:
          type: string
          description: ID do arquivo uploaded
        column_mapping:
          $ref: '#/components/schemas/ColumnMapping'
        defaults:
          $ref: '#/components/schemas/CampaignDefaults'
        skip_invalid_rows:
          type: boolean
          default: false
        publish_immediately:
          type: boolean
          default: false

    ValidationError:
      type: object
      properties:
        row:
          type: integer
        column:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [error, warning]

    # ==================== DUPLICATE ====================
    DuplicateRequest:
      type: object
      required:
        - source_template_id
        - copies
      properties:
        source_template_id:
          type: string
          format: uuid
        copies:
          type: integer
          minimum: 1
          maximum: 20
        variations:
          type: object
          properties:
            append_suffix:
              type: boolean
              default: true
            suffix_template:
              type: string
              default: " - Cópia {{n}}"
            modify_budget:
              type: object
              properties:
                type:
                  type: string
                  enum: [fixed, percentage]
                value:
                  type: number
        publish_immediately:
          type: boolean
          default: false

    # ==================== COMMON ====================
    Keyword:
      type: object
      required:
        - text
        - match_type
      properties:
        text:
          type: string
        match_type:
          type: string
          enum: [BROAD, PHRASE, EXACT]

    SearchAd:
      type: object
      required:
        - headlines
        - descriptions
        - final_url
      properties:
        headlines:
          type: array
          items:
            type: string
          minItems: 3
          maxItems: 15
        descriptions:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 4
        final_url:
          type: string
          format: uri
        path1:
          type: string
          maxLength: 15
        path2:
          type: string
          maxLength: 15

    Extensions:
      type: object
      properties:
        sitelinks:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              url:
                type: string
        callouts:
          type: array
          items:
            type: string

    CampaignPreview:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        budget:
          type: number
        keywords_count:
          type: integer
        headlines_preview:
          type: array
          items:
            type: string

    # ==================== JOBS ====================
    BulkJobResponse:
      type: object
      properties:
        success:
          type: boolean
        job_id:
          type: string
          format: uuid
        status:
          type: string
        total_items:
          type: integer
        estimated_credits:
          type: integer
        message:
          type: string

    BulkJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
        total_items:
          type: integer
        completed_items:
          type: integer
        failed_items:
          type: integer
        estimated_credits:
          type: integer
        consumed_credits:
          type: integer
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    BulkJobDetail:
      allOf:
        - $ref: '#/components/schemas/BulkJob'
        - type: object
          properties:
            config:
              type: object
            items:
              type: array
              items:
                $ref: '#/components/schemas/BulkJobItem'
            error_log:
              type: array
              items:
                $ref: '#/components/schemas/JobError'

    BulkJobItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item_name:
          type: string
        status:
          type: string
        template_id:
          type: string
          format: uuid
        google_campaign_id:
          type: string
        error_message:
          type: string
        credits_cost:
          type: integer

    JobError:
      type: object
      properties:
        item_index:
          type: integer
        template_id:
          type: string
        error:
          type: string
        code:
          type: string

    InsufficientCreditsError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "INSUFFICIENT_CREDITS"
        required_credits:
          type: integer
        available_credits:
          type: integer
        message:
          type: string
