openapi: 3.0.3
info:
  title: AlvoBot Notifications API
  version: 1.0.0
  description: API endpoints for user notifications

paths:
  /notifications:
    get:
      summary: List user notifications
      description: Returns paginated list of notifications for the authenticated user
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
          description: Filter to show only unread notifications
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  total:
                    type: integer
                  unread_count:
                    type: integer

  /notifications/{id}/read:
    patch:
      summary: Mark notification as read
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          description: Notification not found

  /notifications/read-all:
    post:
      summary: Mark all notifications as read
      tags:
        - Notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_count:
                    type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Notification:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - article_published
            - article_failed
            - task_due
            - task_overdue
            - workspace_invite
            - workspace_joined
            - credit_low
            - credit_depleted
            - flow_completed
            - flow_failed
            - system
        title:
          type: string
        message:
          type: string
          nullable: true
        data:
          type: object
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - type
        - title
        - created_at
