openapi: 3.0.3
info:
  title: AlvoBot User Settings API
  version: 1.0.0
  description: API endpoints for user settings and preferences

paths:
  /settings:
    get:
      summary: Get user settings
      description: Returns current user settings and preferences
      tags:
        - Settings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'

    patch:
      summary: Update user settings
      description: Update one or more user settings
      tags:
        - Settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsUpdate'
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          description: Invalid settings value

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserSettings:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
          format: uuid
        email_notifications:
          type: boolean
          description: Receive email notifications
        push_notifications:
          type: boolean
          description: Receive browser push notifications
        weekly_digest:
          type: boolean
          description: Receive weekly summary email
        language:
          type: string
          description: UI language code
          example: pt-BR
        timezone:
          type: string
          description: User timezone
          example: America/Sao_Paulo
        theme:
          type: string
          enum:
            - light
            - dark
        dashboard_layout:
          type: object
          description: Custom dashboard widget configuration
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - email_notifications
        - push_notifications
        - weekly_digest
        - language
        - timezone
        - theme

    UserSettingsUpdate:
      type: object
      properties:
        email_notifications:
          type: boolean
        push_notifications:
          type: boolean
        weekly_digest:
          type: boolean
        language:
          type: string
        timezone:
          type: string
        theme:
          type: string
          enum:
            - light
            - dark
        dashboard_layout:
          type: object
