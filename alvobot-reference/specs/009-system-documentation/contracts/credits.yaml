openapi: 3.0.3
info:
  title: AlvoBot Credits API
  version: 1.0.0
  description: API endpoints for user credits and subscriptions

paths:
  /credits:
    get:
      summary: Get user credit balance
      description: Returns current credit balance and subscription info
      tags:
        - Credits
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Credit balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCredits'

  /credits/transactions:
    get:
      summary: List credit transactions
      description: Returns paginated list of credit transactions
      tags:
        - Credits
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditTransaction'
                  total:
                    type: integer

  /credits/consume:
    post:
      summary: Consume credits
      description: Deduct credits for an operation (internal use)
      tags:
        - Credits
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: integer
                  minimum: 1
                operation:
                  type: string
                  enum:
                    - article_generation
                    - keyword_mining
                    - ai_title_generation
                reference_type:
                  type: string
                reference_id:
                  type: integer
              required:
                - amount
                - operation
      responses:
        '200':
          description: Credits consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCredits'
        '402':
          description: Insufficient credits
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  available_credits:
                    type: integer
                  required_credits:
                    type: integer

  /subscriptions/checkout:
    post:
      summary: Create subscription checkout
      description: Create a Stripe checkout session for subscription
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: string
                  enum:
                    - starter
                    - pro
                    - enterprise
              required:
                - plan
      responses:
        '200':
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkout_url:
                    type: string
                    format: uri
                  session_id:
                    type: string

  /subscriptions/portal:
    post:
      summary: Create customer portal session
      description: Create a Stripe customer portal session
      tags:
        - Subscriptions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portal session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  portal_url:
                    type: string
                    format: uri

  /webhooks/stripe:
    post:
      summary: Stripe webhook handler
      description: Handle Stripe webhook events
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserCredits:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
          format: uuid
        total_credits:
          type: integer
        used_credits:
          type: integer
        available_credits:
          type: integer
          description: Computed field (total - used)
        plan_type:
          type: string
          enum:
            - free
            - starter
            - pro
            - enterprise
        current_period_start:
          type: string
          format: date-time
          nullable: true
        current_period_end:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - total_credits
        - used_credits
        - available_credits
        - plan_type

    CreditTransaction:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: string
          format: uuid
        amount:
          type: integer
          description: Positive for additions, negative for deductions
        operation:
          type: string
          enum:
            - signup_bonus
            - subscription_renewal
            - manual_add
            - article_generation
            - keyword_mining
            - ai_title_generation
            - refund
        reference_type:
          type: string
          nullable: true
        reference_id:
          type: integer
          nullable: true
        balance_after:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - amount
        - operation
        - balance_after
        - created_at
